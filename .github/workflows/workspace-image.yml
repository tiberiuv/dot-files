name: workspace-image

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [master]
    paths:
      - install_scripts/debian/Dockerfile
      - install_scripts/debian/apt-install.sh
      - .github/workflows/workspace-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: workspace-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dot-files-workspace

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: install_scripts/debian
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The scheduled run exists to pick up `apt upgrade`. With the cache,
          # an unchanged base digest replays the old apt layer and the rebuild
          # ships last week's packages under a new tag.
          no-cache: ${{ github.event_name == 'schedule' }}
