# start counting windows from 1 cause 0 is awkward
set -g base-index 1
set -g pane-base-index 1

setw -g monitor-activity off
set -g visual-activity off

# vim mode switching delay fix
set -g escape-time 10
# Not escape-time: this is how long a -r binding stays armed without the prefix
# again. initial-repeat-time is 0, so this governs the first press too.
set -g repeat-time 600

set -g default-terminal "tmux-256color"
# Back to the defaults first: -a appends, so every `source-file` would
# otherwise stack another copy of the entries below.
set -su terminal-features
set -as terminal-features ",*:RGB"
# OSC 52: lets nvim's `"*y` reach the local clipboard from inside tmux, which
# is the only mechanism that works over ssh (no pbcopy/xclip on the far end).
set -as terminal-features ",*:clipboard"
set -g set-clipboard on
set -g mouse on

# Size a window to the clients actually viewing it, not every client attached
# to the session. Only pays off with one session per device -- see `tm`.
setw -g aggressive-resize on

# `send -M` is a no-op for a pager: it never enables mouse reporting, so tmux
# drops the forwarded event. Arrow keys are the only thing less will scroll on.
bind -n WheelUpPane   if -Ft= "#{?pane_in_mode,1,#{mouse_any_flag}}" "send -M" "if -Ft= '#{alternate_on}' 'send -t= -N3 Up' 'copy-mode -et='"
bind -n WheelDownPane if -Ft= "#{?pane_in_mode,1,#{mouse_any_flag}}" "send -M" "if -Ft= '#{alternate_on}' 'send -t= -N3 Down' 'send -M'"

# Same 3 lines per notch once copy-mode is open (tmux defaults to 5).
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N3 scroll-down

# For shelldrop to connect automatically
set -g set-titles on
set -g set-titles-string '#S'

set-option -g status-position bottom

# Split window opens in working directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# prefix + ctrl-k to clear buffer and history. Not -n: that takes C-k from
# every pane, so zsh never sees kill-line.
bind C-k send-keys C-l \; clear-history

# prefix + / to search
bind-key / copy-mode \; send-key ?

#-------------------------------------------------------#
set -g @tpm_plugins '               \
    tmux-plugins/tpm                \
    tmux-plugins/tmux-yank          \
    tmux-plugins/tmux-sensible      \
    egel/tmux-gruvbox               \
    tmux-plugins/tmux-resurrect     \
'
set -g @tmux-gruvbox 'dark'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-dir '~/.tmux-resurrect'
set -g @resurrect-processes 'watch'

# Autosave and restore in place of tmux-continuum, which triggers saves from a
# status-right #(): 44 execs per client per status-interval, due or not.
#
# @autosave is unset only on a fresh server, so the block runs once per server
# and a re-source cannot stack a second loop. run-shell expands #{pid} at
# launch (## keeps it literal for the loop), so the loop exits with its server
# even if a new one has taken the socket by the time it wakes.
%if "#{==:#{@autosave},}"
set -g @autosave on
run -b 'p=#{pid}; while sleep 900 && [ "$(tmux display -p "##{pid}")" = "$p" ]; do ~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet; done'
# Only where the host can be rebuilt or stopped underneath the session.
if-shell '[ "$(uname)" = "Linux" ]' "run -b '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'"
%endif

set-window-option -g xterm-keys on
set -g focus-events on

# Initialize TMUX plugin manager (must be the last command)
run -b '~/.tmux/plugins/tpm/tpm'
